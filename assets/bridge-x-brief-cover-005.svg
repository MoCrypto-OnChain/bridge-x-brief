<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bridge X Brief Edition 005 — The CLARITY Act Reaches the Senate Floor</title>
  <desc id="desc">A Bridge X Capital executive-intelligence cover showing cloture filed, a sixty-vote Senate gate, and final law not yet complete.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061824"/><stop offset="1" stop-color="#081d2a"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#0b2734" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".55"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="74" y="78" fill="#35d37d" font-size="20" font-weight="700">THE BRIDGE X BRIEF · EDITION 005</text>
    <text x="1526" y="82" text-anchor="end" fill="#d7b35c" font-size="36" font-weight="800">BXB</text>
    <text x="1526" y="112" text-anchor="end" fill="#9db7b5" font-size="14" font-weight="700">AUGUST 2026</text>
    <path d="M445 318H555M1045 318H1155M800 458V520H1060V573" fill="none" stroke="#26414b" stroke-width="3"/>
    <g transform="translate(165 178)"><circle cx="140" cy="140" r="139" fill="#0a2230" stroke="#58b8df" stroke-width="3"/><text x="140" y="92" text-anchor="middle" fill="#58b8df" font-size="20" font-weight="700">CLOTURE</text><text x="140" y="150" text-anchor="middle" fill="#edf5f1" font-size="39" font-weight="800">FILED</text><text x="140" y="200" text-anchor="middle" fill="#9db7b5" font-size="13" font-weight="700">MOTION TO PROCEED</text></g>
    <g transform="translate(555 108)"><ellipse cx="245" cy="175" rx="244" ry="174" fill="#0e2a39" stroke="#d7b35c" stroke-width="4"/><text x="245" y="100" text-anchor="middle" fill="#d7b35c" font-size="20" font-weight="700">SENATE FLOOR</text><text x="245" y="202" text-anchor="middle" fill="#edf5f1" font-size="86" font-weight="800">60</text><text x="245" y="257" text-anchor="middle" fill="#35d37d" font-size="27" font-weight="800">VOTE GATE</text><text x="245" y="300" text-anchor="middle" fill="#9db7b5" font-size="13" font-weight="700">PROCEDURAL MOVEMENT</text></g>
    <g transform="translate(1155 178)"><circle cx="140" cy="140" r="139" fill="#0a2230" stroke="#35d37d" stroke-width="3"/><text x="140" y="92" text-anchor="middle" fill="#35d37d" font-size="20" font-weight="700">FINAL LAW</text><text x="140" y="150" text-anchor="middle" fill="#edf5f1" font-size="35" font-weight="800">NOT YET</text><text x="140" y="200" text-anchor="middle" fill="#9db7b5" font-size="13" font-weight="700">DEBATE · AMENDMENTS</text></g>
    <rect x="1008" y="573" width="360" height="70" rx="10" fill="#0a2230" stroke="#26414b" stroke-width="2"/><text x="1188" y="616" text-anchor="middle" fill="#d7b35c" font-size="19" font-weight="800">MOTION ≠ COMPLETION</text>
    <text x="74" y="646" fill="#edf5f1" font-size="47" font-weight="800">THE CLARITY ACT REACHES</text><text x="74" y="728" fill="#d7b35c" font-size="68" font-weight="800">THE SENATE FLOOR.</text>
    <text x="78" y="780" fill="#9db7b5" font-size="18" font-weight="700">AMERICA'S DIGITAL-ASSET RULEBOOK IS CLOSER — BUT NOT COMPLETE.</text>
    <text x="1526" y="780" text-anchor="end" fill="#35d37d" font-size="17" font-weight="700">READ THE FULL BRIEF → BRIEF.BRIDGEXCAPITAL.AI</text>
    <text x="76" y="846" fill="#9db7b5" font-size="13" font-weight="700">EXECUTIVE INTELLIGENCE · EDUCATION BY DEFAULT · PRIMARY-SOURCE RECEIPTS</text>
